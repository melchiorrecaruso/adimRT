name: build-test

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Lazarus
      run: |
        sudo apt-get update
        sudo apt-get install lazarus

    - name: Build ADimMath validation suite
      run: |
        lazbuild test.lpi

    - name: Run ADimMath validation suite
      run: |
        ./build/test

    - name: Build project
      run: |
        lazbuild adimtest.lpi

    - name: Test project
      run: |
        ./build/adimtest
        exit_code=$?

        if [ $exit_code -ne 0 ]; then
          echo "Test exited with a non-zero exit code: $exit_code"
          exit 1
        fi



