name: build-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Lazarus
      run: |
        sudo apt-get update
        sudo apt-get install lazarus

    - name: Build ADimMath validation suite
      run: |
        lazbuild test.lpi

    - name: Run ADimMath validation suite
      run: |
        ./build/test

    - name: Build project
      run: |
        lazbuild adimtest.lpi

    - name: Test project
      run: |
        ./build/adimtest
